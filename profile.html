
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OWL PIC | My Profile</title>

    <link rel="stylesheet" href="styles.css">

    <style>
        .profile-page {
            max-width: 900px;
            margin: 50px auto;
            padding: 25px;
        }

        .profile-card {
            background: #111018;
            border: 1px solid #7130a8;
            border-radius: 18px;
            padding: 35px;
            text-align: center;
            box-shadow: 0 0 20px rgba(113,48,168,.2);
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #7130a8;
            background: #21152d;
            object-fit: cover;
            margin-bottom: 15px;
        }

        .profile-card h1 {
            color: white;
            margin-bottom: 8px;
        }

        .profile-card p {
            color: #ccc;
        }

        .profile-form {
            margin-top: 30px;
            text-align: left;
        }

        .profile-form label {
            display: block;
            color: white;
            margin: 18px 0 8px;
        }

        .profile-form input,
        .profile-form textarea {
            width: 100%;
            padding: 13px;
            background: #08070c;
            border: 1px solid #7130a8;
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
        }

        .profile-form textarea {
            min-height: 110px;
            resize: vertical;
        }

        .profile-button {
            margin-top: 22px;
            width: 100%;
            padding: 14px;
            background: #7130a8;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .profile-button:hover {
            background: #9145cf;
        }

        .profile-status {
            margin-top: 15px;
            color: white;
        }
    </style>
</head>

<body>

<header class="topbar">

<main class="profile-page">

<input

    accept="image/png, image/jpeg, image/webp"
>

<p class="profile-status">
    JPG, PNG, or WEBP. Maximum file size: 5 MB.
</p>
            <label for="bio">About Me</label>
            <textarea
                id="bio"
                maxlength="300"
                placeholder="Tell the community about yourself..."
            ></textarea>

            <button type="submit" class="profile-button">
                SAVE PROFILE

        </form>

        <p><a href="index.html">← Back to OWL PIC</a></p>

    </section>


</main>

<!-- Load the Supabase library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    
// OWL PIC - PROFILE PAGE

const SUPABASE_URL = "https://djustjxfcfexlysqgdyq.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_uo5uRAaC1mCk1txpLXPCOQ_47T7qk2A";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

const profileForm = document.getElementById("profile-form");
const usernameInput = document.getElementById("username");
const avatarFileInput = document.getElementById("avatar-file");
const bioInput = document.getElementById("bio");
const avatarImage = document.getElementById("profile-avatar");
const statusMessage = document.getElementById("profile-status");

let currentUser = null;
let previewUrl = null;

// Check whether the visitor is signed in.
async function loadProfile() {
    const { data, error } = await supabaseClient.auth.getUser();

    if (error || !data.user) {
        window.location.href =
            "auth.html?returnTo=" +
            encodeURIComponent("profile.html");
        return;
    }

    currentUser = data.user;

    const { data: profile, error: profileError } =
        await supabaseClient
            .from("profiles")
            .select("username, avatar_url, bio")
            .eq("id", currentUser.id)
            .maybeSingle();

    if (profileError) {
        console.error(profileError);
        statusMessage.textContent = "Unable to load your profile.";
        return;
    }

    if (profile) {
        usernameInput.value = profile.username || "";
        bioInput.value = profile.bio || "";

        if (profile.avatar_url) {
            avatarImage.src = profile.avatar_url;
        }
    }
}

// Preview and validate the selected photo.
avatarFileInput.addEventListener("change", function () {
    const file = avatarFileInput.files[0];

    if (!file) return;

    const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp"
    ];

    if (!allowedTypes.includes(file.type)) {
        statusMessage.textContent =
            "Please choose a JPG, PNG, or WEBP image.";
        avatarFileInput.value = "";
        return;
    }

    if (file.size > 5 * 1024 * 1024) {
        statusMessage.textContent =
            "Your picture must be smaller than 5 MB.";
        avatarFileInput.value = "";
        return;
    }

    if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
    }

    previewUrl = URL.createObjectURL(file);
    avatarImage.src = previewUrl;

    statusMessage.textContent =
        "Photo selected. Save your profile to submit it for review.";
});

// Upload a selected photo to private pending storage.

async function uploadPendingPhoto(file) {
    const extensions = {
        "image/jpeg": "jpg",
        "image/png": "png",
        "image/webp": "webp"
    };

    const extension = extensions[file.type];

    if (!extension) {
        throw new Error("Unsupported image format.");
    }

    const storagePath =
        currentUser.id + "/" +
        crypto.randomUUID() + "." + extension;

    // Upload photo to private storage.
    const { error: uploadError } = await supabaseClient
        .storage
        .from("pending-photos")
        .upload(storagePath, file, {
            contentType: file.type,
            upsert: false
        });

    if (uploadError) {
        throw uploadError;
    }

    // Create the pending submission and retrieve its ID.
    const { data: submission, error: recordError } =
        await supabaseClient
            .from("photo_submissions")
            .insert({
                user_id: currentUser.id,
                storage_path: storagePath,
                status: "pending"
            })
            .select("id")
            .single();

    if (recordError) {
        await supabaseClient
            .storage
            .from("pending-photos")
            .remove([storagePath]);

        throw recordError;
    }

    // Send this photo submission to the AI moderation function.
    const { data: moderationData, error: moderationError } =
        await supabaseClient.functions.invoke(
            "moderate-profile-photo",
            {
                body: {
                    submissionId: submission.id
                }
            }
        );

    if (moderationError || !moderationData?.success) {
        console.error(
            "AI moderation error:",
            moderationError || moderationData
        );

        return {
            screeningFailed: true,
            flagged: null
        };
    }

    return {
        screeningFailed: false,
        flagged: moderationData.flagged
    };
}
